# Servidor de FTP de la Conexión de Cámara en un VPS propio (alternativa a Fly.io).
#
# Sólo levanta el servidor de FTP. La ingesta de las fotos (pasar el JPG
# subido a una foto del álbum) la hace el cron de Vercel
# /api/cron/process-camera-ingest-jobs; no hace falta otro contenedor.
#
# Uso, desde la raíz del monorepo:
#   cp apps/compramelafoto-workers/camera-ftp-gateway/.env.example apps/compramelafoto-workers/deploy/camera-connection/.env   # completar valores
#   docker compose -f apps/compramelafoto-workers/deploy/camera-connection/docker-compose.yml up -d --build
#
# Contexto de build: raíz del monorepo (cuatro niveles arriba de este archivo).

services:
  camera-ftp-gateway:
    build:
      context: ../../../..
      dockerfile: apps/compramelafoto-workers/camera-ftp-gateway/Dockerfile
    container_name: clf-camera-ftp-gateway
    env_file:
      - .env
    environment:
      CAMERA_CONNECTION_FTP_PORT: "21"
      HEALTH_PORT: "8080"
      FTP_PASV_MIN_PORT: "50000"
      FTP_PASV_MAX_PORT: "50050"
      FTP_PASV_URL: ${FTP_PASV_URL:?FTP_PASV_URL es obligatorio — IP pública del VPS}
    ports:
      - "21:21"
      - "8080:8080"
      - "50000-50050:50000-50050"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
