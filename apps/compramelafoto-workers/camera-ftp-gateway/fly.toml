# Servidor de FTP de ComprameLaFoto en Fly.io (NO está desplegado todavía).
# Guía paso a paso: apps/compramelafoto-workers/deploy/README.md
#
# Se despliega desde la RAÍZ del monorepo:
#   fly deploy -c apps/compramelafoto-workers/camera-ftp-gateway/fly.toml \
#     --dockerfile apps/compramelafoto-workers/camera-ftp-gateway/Dockerfile
#
# Acá no va ningún secreto. DATABASE_URL, R2_* y FTP_PASV_URL se cargan con
# `fly secrets set` (ver la guía).

app = "clf-camera-ftp"
primary_region = "eze" # Buenos Aires

[build]
  dockerfile = "Dockerfile"

[env]
  CAMERA_CONNECTION_FTP_PORT = "21"
  HEALTH_PORT = "8080"
  FTP_PASV_MIN_PORT = "50000"
  FTP_PASV_MAX_PORT = "50050"
  # Máximo por archivo en el servidor (30 MB). La app acepta hasta 10 MB.
  FTP_MAX_UPLOAD_BYTES = "31457280"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Una sola máquina, siempre encendida: el FTP no puede "dormirse" porque la
# cámara se conecta sin avisar.
[[services]]
  protocol = "tcp"
  internal_port = 21
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 21

# /health queda sólo dentro de Fly (no se publica a Internet).
[checks]
  [checks.health]
    type = "http"
    port = 8080
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# Datos en modo pasivo: un puerto por bloque (50000 a 50050). Tienen que
# coincidir con FTP_PASV_MIN_PORT y FTP_PASV_MAX_PORT de arriba.

[[services]]
  protocol = "tcp"
  internal_port = 50000
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 50000

