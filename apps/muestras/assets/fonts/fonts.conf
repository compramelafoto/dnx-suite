<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Configuración mínima de fontconfig para las piezas para redes (lib/redes/fuentes.ts).
  Sin fuentes del sistema: la única fuente es la que se registra con `fontfile`.
  Sólo hace una cosa: cuando se pide negrita y el archivo es Regular, la sintetiza (como hace la
  configuración por defecto de Linux, que en Vercel no existe).
-->
<fontconfig>
  <match target="font">
    <test name="weight" compare="less_eq"><const>medium</const></test>
    <test target="pattern" name="weight" compare="more_eq"><const>bold</const></test>
    <edit name="embolden" mode="assign"><bool>true</bool></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>
