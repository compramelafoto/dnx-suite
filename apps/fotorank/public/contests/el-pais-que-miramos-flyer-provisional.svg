<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#12161d"/>
      <stop offset="38%"  stop-color="#1b222c"/>
      <stop offset="70%"  stop-color="#2a2119"/>
      <stop offset="100%" stop-color="#0d0f13"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.705" cy="0.352" r="0.42">
      <stop offset="0%" stop-color="#f0c264" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#e8b44a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e8b44a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39424f"/><stop offset="100%" stop-color="#232a34"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232a35"/><stop offset="100%" stop-color="#161b23"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11151b"/><stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#08090c" stop-opacity="0"/>
      <stop offset="46%"  stop-color="#08090c" stop-opacity="0.20"/>
      <stop offset="74%"  stop-color="#08090c" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#08090c" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="#08090c"/>

  <!-- Paisaje: horizonte argentino sugerido, no ilustrado en exceso -->
  <g>
    <rect width="1080" height="820" fill="url(#sky)"/>
    <rect width="1080" height="820" fill="url(#sun)"/>
    <circle cx="762" cy="470" r="86" fill="#f0c264" opacity="0.34"/>
    <circle cx="762" cy="470" r="52" fill="#f7d489" opacity="0.55"/>
    <path d="M0 556 L168 452 L268 512 L392 418 L520 520 L640 462 L790 548 L920 486 L1080 552 L1080 820 L0 820 Z" fill="url(#ridgeFar)" opacity="0.95"/>
    <path d="M0 640 L146 566 L296 632 L446 552 L600 640 L742 578 L900 652 L1080 596 L1080 820 L0 820 Z" fill="url(#ridgeMid)"/>
    <path d="M0 724 L200 666 L372 726 L560 662 L744 736 L916 684 L1080 730 L1080 820 L0 820 Z" fill="url(#ridgeNear)"/>
    <g opacity="0.5" fill="#e9edf5">
      <circle cx="176" cy="152" r="1.7"/><circle cx="322" cy="98" r="1.3"/><circle cx="470" cy="176" r="1.5"/>
      <circle cx="612" cy="120" r="1.2"/><circle cx="880" cy="164" r="1.6"/><circle cx="978" cy="96" r="1.3"/>
      <circle cx="244" cy="236" r="1.2"/><circle cx="742" cy="222" r="1.4"/>
    </g>
    <rect width="1080" height="820" fill="url(#fade)"/>
  </g>

  <!-- Marco -->
  <rect x="46" y="46" width="988" height="1258" fill="none" stroke="#c9a227" stroke-opacity="0.30" stroke-width="1.5"/>

  <!-- Encabezado -->
  <g transform="translate(96 132)">
    <rect x="0" y="-2" width="52" height="2.5" fill="#c9a227"/>
    <text x="70" y="6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19"
          letter-spacing="5.5" fill="#c9a227" font-weight="600">CONCURSO NACIONAL DE FOTOGRAFÍA</text>
  </g>
  <text x="96" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19"
        letter-spacing="5.5" fill="#8d93a0" font-weight="500">FOTORANK · PRIMERA EDICIÓN 2026</text>

  <!-- Título -->
  <g transform="translate(96 640)">
    <text x="0" y="0"   font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="128" font-weight="700" fill="#f6f7f9" letter-spacing="-3">EL PAÍS</text>
    <text x="0" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="128" font-weight="700" fill="#f6f7f9" letter-spacing="-3">QUE</text>
    <text x="0" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="128" font-weight="700" fill="#c9a227" letter-spacing="-3">MIRAMOS</text>
  </g>

  <!-- Premio -->
  <g transform="translate(96 990)">
    <rect x="0" y="0" width="4" height="96" fill="#c9a227"/>
    <text x="30" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17"
          letter-spacing="4.5" fill="#8d93a0" font-weight="600">GRAN PREMIO</text>
    <text x="30" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46"
          font-weight="600" fill="#f6f7f9">Ganá una cámara mirrorless</text>
  </g>

  <!-- Datos -->
  <g transform="translate(96 1136)">
    <line x1="0" y1="0" x2="888" y2="0" stroke="#c9a227" stroke-opacity="0.22" stroke-width="1"/>
    <text x="0" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3.5" fill="#8d93a0" font-weight="600">INSCRIPCIONES</text>
    <text x="0" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#f6f7f9" font-weight="500">21 de septiembre</text>

    <text x="336" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3.5" fill="#8d93a0" font-weight="600">CIERRE</text>
    <text x="336" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#f6f7f9" font-weight="500">5 de diciembre</text>

    <text x="626" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3.5" fill="#8d93a0" font-weight="600">PARTICIPAN</text>
    <text x="626" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#f6f7f9" font-weight="500">Todo el país</text>
  </g>

  <text x="96" y="1268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18"
        fill="#6f7480">Profesionales y aficionados · Hasta 3 fotografías por participante</text>
  <text x="984" y="1268" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="18" letter-spacing="4" fill="#c9a227" font-weight="600">FOTORANK</text>
</svg>
